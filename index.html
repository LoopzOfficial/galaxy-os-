<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Galaxy OS 2.0</title>
  <style>
    /* ==========================================
       1. GLOBAL RESET & PHONE FRAME
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Phone Body Simulation */
    #phone {
      width: 375px;
      height: 812px;
      background: linear-gradient(135deg, #1e1b4b, #311042, #000000);
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 12px #2d3748;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch / Dynamic Island Look */
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .notch-camera {
      width: 10px;
      height: 10px;
      background: #111827;
      border: 2px solid #1f2937;
      border-radius: 50%;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      z-index: 900;
    }

    /* ==========================================
       2. DESKTOP & APP GRID
       ========================================== */
    .desktop {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: max-content;
      gap: 20px 16px;
      align-content: start;
      margin-top: 15px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .app-icon:active {
      transform: scale(0.82); /* Fluid iOS press effect */
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .app-name {
      color: #fff;
      font-size: 11px;
      margin-top: 6px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Dynamic App Gradient Colors */
    .bg-browser { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .bg-notes   { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .bg-gallery { background: linear-gradient(135deg, #ec4899, #8b5cf6); }
    .bg-settings{ background: linear-gradient(135deg, #6b7280, #374151); }
    .bg-arcade  { background: linear-gradient(135deg, #10b981, #059669); }

    /* ==========================================
       3. WINDOW MANAGEMENT & iOS ANIMATIONS
       ========================================== */
    .app-window {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 48px;
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      z-index: 500;
      display: flex;
      flex-direction: column;
      overflow: hidden;

      /* iOS Spring Motion */
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) translateY(40px);
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), 
                  opacity 0.3s ease, 
                  border-radius 0.3s ease;
    }

    .app-window.active {
      opacity: 1;
      pointer-events: all;
      transform: scale(1) translateY(0);
    }

    .window-header {
      height: 48px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 600;
      color: #1e293b;
    }

    .window-body {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* Web Browser App Styles */
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #cbd5e1;
    }

    .browser-input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }

    .browser-btn {
      border: none;
      background: #3b82f6;
      color: white;
      padding: 0 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    iframe.web-viewport {
      width: 100%;
      height: calc(100% - 45px);
      border: none;
    }

    /* ==========================================
       4. ANDROID NAVIGATION BAR
       ========================================== */
    .android-nav-bar {
      height: 48px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 950;
    }

    .nav-btn {
      width: 50px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #ffffff;
      font-size: 18px;
      transition: transform 0.15s ease, opacity 0.15s ease;
      opacity: 0.8;
    }

    .nav-btn:active {
      transform: scale(0.7);
      opacity: 1;
    }

    .nav-icon-back {
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 12px solid white;
    }

    .nav-icon-home {
      width: 14px;
      height: 14px;
      border: 2.5px solid white;
      border-radius: 50%;
    }

    .nav-icon-recents {
      width: 12px;
      height: 12px;
      border: 2.5px solid white;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="phone">
    <!-- Top Hardware Notch -->
    <div class="notch">
      <div class="notch-camera"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="clock">12:00</span>
      <div style="display: flex; gap: 6px;">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Desktop Screen -->
    <div class="desktop">
      <!-- Browser App Icon -->
      <div class="app-icon" onclick="openApp('app-browser')">
        <div class="icon-box bg-browser">🌐</div>
        <span class="app-name">Internet</span>
      </div>

      <!-- Notes App Icon -->
      <div class="app-icon" onclick="openApp('app-notes')">
        <div class="icon-box bg-notes">📝</div>
        <span class="app-name">Notes</span>
      </div>

      <!-- Gallery App Icon -->
      <div class="app-icon" onclick="openApp('app-gallery')">
        <div class="icon-box bg-gallery">🖼️</div>
        <span class="app-name">Gallery</span>
      </div>

      <!-- Settings App Icon -->
      <div class="app-icon" onclick="openApp('app-settings')">
        <div class="icon-box bg-settings">⚙️</div>
        <span class="app-name">Settings</span>
      </div>
    </div>

    <!-- APP WINDOW 1: INTERNET BROWSER -->
    <div id="app-browser" class="app-window">
      <div class="window-header">
        <span>Web Browser</span>
      </div>
      <div class="browser-bar">
        <input type="text" id="url-input" class="browser-input" value="https://bing.com" placeholder="Search or type URL" />
        <button class="browser-btn" onclick="navigateBrowser()">Go</button>
      </div>
      <iframe id="web-frame" class="web-viewport" src="https://bing.com"></iframe>
    </div>

    <!-- APP WINDOW 2: NOTES -->
    <div id="app-notes" class="app-window">
      <div class="window-header">
        <span>Quick Notes</span>
      </div>
      <div class="window-body" style="padding: 16px;">
        <textarea style="width:100%; height:90%; border:none; outline:none; font-size:16px; resize:none;" placeholder="Type your ideas here..."></textarea>
      </div>
    </div>

    <!-- APP WINDOW 3: GALLERY -->
    <div id="app-gallery" class="app-window">
      <div class="window-header">
        <span>Gallery</span>
      </div>
      <div class="window-body" style="padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div style="height: 100px; background: #cbd5e1; border-radius: 12px;"></div>
        <div style="height: 100px; background: #94a3b8; border-radius: 12px;"></div>
        <div style="height: 100px; background: #64748b; border-radius: 12px;"></div>
        <div style="height: 100px; background: #475569; border-radius: 12px;"></div>
      </div>
    </div>

    <!-- APP WINDOW 4: SETTINGS -->
    <div id="app-settings" class="app-window">
      <div class="window-header">
        <span>Settings</span>
      </div>
      <div class="window-body" style="padding: 16px; color: #333;">
        <h4 style="margin-bottom: 10px;">Galaxy OS 2.0</h4>
        <p style="font-size: 14px; color: #666;">Version: 2.0.0-Beta</p>
        <p style="font-size: 14px; color: #666; margin-top: 8px;">Animations: Smooth Springs Enabled</p>
      </div>
    </div>

    <!-- Android Navigation Bar Buttons -->
    <div class="android-nav-bar">
      <!-- Back Button -->
      <div class="nav-btn" onclick="androidBack()">
        <div class="nav-icon-back"></div>
      </div>
      <!-- Home Button -->
      <div class="nav-btn" onclick="androidHome()">
        <div class="nav-icon-home"></div>
      </div>
      <!-- Recents Button -->
      <div class="nav-btn" onclick="androidRecents()">
        <div class="nav-icon-recents"></div>
      </div>
    </div>
  </div>

  <script>
    let activeAppId = null;

    // Open App with Smooth iOS Spring
    function openApp(appId) {
      const app = document.getElementById(appId);
      if (app) {
        app.classList.add('active');
        activeAppId = appId;
      }
    }

    // Android Navigation Logic
    function androidHome() {
      if (activeAppId) {
        document.getElementById(activeAppId).classList.remove('active');
        activeAppId = null;
      }
    }

    function androidBack() {
      // Closes current open window
      if (activeAppId) {
        androidHome();
      }
    }

    function androidRecents() {
      // Quick press feedback / toggle effect for multi-tasking preview
      if (activeAppId) {
        const app = document.getElementById(activeAppId);
        app.style.transform = 'scale(0.8) translateY(-20px)';
        setTimeout(() => {
          app.style.transform = '';
        }, 300);
      }
    }

    // In-OS Web Browser Navigation
    function navigateBrowser() {
      let url = document.getElementById('url-input').value;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      document.getElementById('web-frame').src = url;
    }

    // Dynamic Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
